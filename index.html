<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--y:#F2C744;--y2:#FBE88A;--y3:#FFF8DC;--yd:#D4A017;
--b:#0A0A0A;--b2:#1A1A1A;--g7:#444;--g4:#999;--g2:#E0E0E0;--g1:#F5F5F3;--w:#FAFAF8;
--serif:'Instrument Serif',Georgia,serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth;font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--sans);background:var(--w);color:var(--b);overflow-x:hidden;line-height:1.6}
a{color:inherit;text-decoration:none}::selection{background:var(--y);color:var(--b)}
.ctn{max-width:1140px;margin:0 auto;padding:0 2.5rem}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:1.1rem 0;transition:all .5s cubic-bezier(.16,1,.3,1)}
nav.s{background:rgba(255,248,220,.94);backdrop-filter:blur(30px);border-bottom:1px solid rgba(0,0,0,.06)}
nav .ctn{display:flex;justify-content:space-between;align-items:center}
.nlogo{font-family:var(--mono);font-weight:500;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase}
.nlinks{display:flex;gap:2rem;list-style:none;align-items:center}
.nlinks a{font-size:.8rem;font-weight:400;letter-spacing:.03em;color:var(--g7);transition:color .3s}
.nlinks a:hover{color:var(--b)}
.ncta{background:var(--b)!important;color:var(--y)!important;padding:.5rem 1.3rem!important;border-radius:6px;font-weight:500!important;transition:all .3s}
.ncta:hover{transform:translateY(-1px)}
.ham{display:none;flex-direction:column;gap:5px;cursor:pointer;z-index:1001}
.ham span{width:22px;height:1.5px;background:var(--b);transition:all .3s}
.ham.a span:nth-child(1){transform:rotate(45deg) translate(4px,4px)}
.ham.a span:nth-child(2){opacity:0}
.ham.a span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px)}

/* HERO */
.hero{min-height:100vh;background:var(--y);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6rem 2rem}
.hero-floats{position:absolute;inset:0;pointer-events:none;z-index:0}
.hero-floats svg{position:absolute;opacity:.08;animation:floatSlow 20s ease-in-out infinite}
.hero-floats .f1{top:8%;left:5%;width:120px;animation-delay:0s}
.hero-floats .f2{top:15%;right:8%;width:80px;animation-delay:-4s;animation-duration:25s}
.hero-floats .f3{bottom:20%;left:12%;width:100px;animation-delay:-8s;animation-duration:22s}
.hero-floats .f4{bottom:10%;right:5%;width:150px;animation-delay:-2s;animation-duration:28s}
.hero-floats .f5{top:45%;left:2%;width:60px;animation-delay:-6s;animation-duration:18s}
.hero-floats .f6{top:30%;right:15%;width:90px;animation-delay:-10s;animation-duration:24s}
.hero-floats .f7{bottom:35%;right:25%;width:70px;animation-delay:-12s}
.hero-floats .f8{top:60%;left:30%;width:110px;animation-delay:-3s;animation-duration:26s}
.hero-canvas{position:absolute;inset:0;z-index:0;opacity:.85}
.hero-c{position:relative;z-index:1;max-width:1000px;width:90%}
.hero-logo{font-family:var(--serif);font-size:clamp(5rem,14vw,12rem);font-weight:400;line-height:.85;letter-spacing:-.04em;margin-bottom:1rem;opacity:0;animation:fadeUp 1s .3s both}
.hero-logo em{font-style:italic}
.hero-sub{font-family:var(--serif);font-size:clamp(1.2rem,2.5vw,1.8rem);font-style:italic;line-height:1.3;margin-bottom:2rem;opacity:0;animation:fadeUp 1s .5s both;color:var(--b2)}

.hero-btn{display:inline-block;background:var(--b);color:var(--y);padding:.8rem 2.2rem;border-radius:6px;font-weight:500;font-size:.9rem;opacity:0;animation:fadeUp 1s .9s both;transition:all .3s}
.hero-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.15)}
.hero-scroll{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:1;font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--b2);opacity:0;animation:fadeIn 1s 1.2s both}
.hero-scroll::after{content:'';display:block;width:1px;height:40px;background:var(--b);margin:.8rem auto 0;animation:scrollL 2s ease-in-out infinite}

/* RIBBON */
.rib{background:var(--b);padding:.8rem 0;overflow:hidden}
.rib-t{display:flex;animation:marq 45s linear infinite;white-space:nowrap}
.rib-i{font-family:var(--serif);font-size:.9rem;font-style:italic;color:var(--y);padding:0 2.5rem;display:flex;align-items:center;gap:1.2rem;flex-shrink:0}
.rib-d{width:3px;height:3px;background:var(--y);border-radius:50%;opacity:.4}

/* SECTIONS */
section{padding:6rem 0}
.slab{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--g4);margin-bottom:1.2rem}
.stit{font-family:var(--serif);font-size:clamp(2rem,4vw,3.2rem);font-weight:400;line-height:1.08;letter-spacing:-.02em;margin-bottom:1.2rem}
.stit em{font-style:italic;color:var(--yd)}
.sint{font-size:1rem;line-height:1.8;color:var(--g7);max-width:600px;font-weight:300}

/* TAGLINE BANNER */
.tagline{background:var(--y3);padding:3.5rem 0;text-align:center;position:relative;overflow:hidden}
.tagline h2{font-family:var(--serif);font-size:clamp(1.6rem,3.5vw,2.6rem);font-weight:400;font-style:italic;line-height:1.2;letter-spacing:-.01em;color:var(--b)}

/* MANIFESTO */
.manifesto{background:var(--b);position:relative;overflow:hidden;padding:7rem 0}
.manifesto-canvas{position:absolute;inset:0;pointer-events:none;z-index:0}
.manifesto .ctn{position:relative;z-index:1}
.manifesto-text{max-width:720px;margin:0 auto;text-align:center}
.manifesto-text p{font-family:var(--serif);font-size:clamp(1.05rem,1.8vw,1.25rem);line-height:1.85;color:rgba(255,255,255,.65);font-weight:400;margin-bottom:1.5rem}
.manifesto-text p:last-child{margin-bottom:0}
.manifesto-text strong{color:var(--y);font-weight:400}

/* NUOVA EDIZIONE */
.nuova{background:var(--w)}
.nuova-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;margin-top:3rem}
.nuova-text p{font-size:1rem;line-height:1.85;color:var(--g7);font-weight:300;margin-bottom:1.2rem}
.nuova-text strong{font-weight:500;color:var(--b)}
.nuova-quote{font-family:var(--serif);font-size:1.4rem;font-style:italic;line-height:1.4;color:var(--yd);border-left:2px solid var(--y);padding-left:1.5rem;margin:2rem 0}

/* PREMI */
.premi{background:var(--y3)}
.premi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--g2);border-radius:14px;overflow:hidden;margin-top:3rem}
.premio{background:var(--w);padding:2.5rem 2rem;transition:all .5s cubic-bezier(.16,1,.3,1)}
.premio:hover{background:var(--b);color:var(--y)}
.premio:hover .premio-n{color:var(--y)}
.premio:hover .premio-d{color:rgba(255,255,255,.6)}
.premio-n{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--g4);margin-bottom:1.5rem;transition:color .5s}
.premio-t{font-family:var(--serif);font-size:1.4rem;margin-bottom:.6rem;line-height:1.15}
.premio-d{font-size:.85rem;line-height:1.6;color:var(--g7);transition:color .5s}

/* CRITERI */
.criteri{background:var(--b);color:var(--w);padding:7rem 0}
.criteri .slab{color:var(--y);opacity:.6}
.criteri .stit{color:var(--w)}
.criteri .stit em{color:var(--y)}
.criteri-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-top:3rem}
.criterio{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:2.5rem 2rem;transition:all .4s}
.criterio:hover{border-color:var(--y);background:rgba(242,199,68,.05)}
.criterio h3{font-family:var(--serif);font-size:1.3rem;margin-bottom:.8rem;color:var(--y)}
.criterio p{font-size:.88rem;line-height:1.7;color:rgba(255,255,255,.5)}

/* ARCHIVIO */
.archivio{background:var(--y3)}
.year-tabs{display:flex;gap:.5rem;margin:2rem 0;flex-wrap:wrap}
.year-tab{font-family:var(--mono);font-size:.8rem;padding:.6rem 1.5rem;border-radius:100px;cursor:pointer;background:transparent;border:1.5px solid var(--g2);color:var(--g7);transition:all .3s;letter-spacing:.03em}
.year-tab:hover,.year-tab.active{background:
